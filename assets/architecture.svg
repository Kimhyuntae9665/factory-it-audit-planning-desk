<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Factory IT audit planning flow</title>
  <desc id="desc">Fictional JSON source records flow into Python rules, then an HTML planning matrix, human review and a JSON export.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#53627e" opacity=".56"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#080f1e" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9bd7ea" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="700" height="520" rx="20" fill="#15243a"/>
  <rect width="700" height="520" rx="20" fill="url(#dots)"/>
  <g fill="none" stroke="#9bd7ea" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M201 143 C225 143 232 143 258 143"/>
    <path d="M435 143 C459 143 466 143 492 143"/>
    <path d="M584 230 C602 251 602 273 584 294"/>
    <path d="M493 381 C471 381 458 381 435 381"/>
  </g>
  <g fill="#f8fbff" stroke="#c6d8ec" stroke-width="1.5">
    <rect x="27" y="57" width="174" height="173" rx="24"/>
    <rect x="261" y="57" width="174" height="173" rx="24"/>
    <rect x="495" y="57" width="174" height="173" rx="24"/>
    <rect x="495" y="294" width="174" height="173" rx="24"/>
    <rect x="261" y="294" width="174" height="173" rx="24"/>
  </g>
  <!-- Original geometric pictograms: each occupies its own fitted area. -->
  <g fill="none" stroke="#2868a3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 91 h48 l16 16 v54 h-64 z M134 91 v16 h16 M98 121 h40 M98 136 h40 M98 151 h29"/>
    <path d="M322 94 h52 a13 13 0 0 1 13 13 v20 h-38 a13 13 0 0 0 -13 13 v13 h-20 v-25 a14 14 0 0 1 14 -14 h34"/>
    <circle cx="367" cy="106" r="2.8" fill="#2868a3" stroke="none"/>
    <path d="M558 93 h48 a12 12 0 0 1 12 12 v43 a12 12 0 0 1 -12 12 h-48 a12 12 0 0 1 -12 -12 v-43 a12 12 0 0 1 12 -12 z M546 113 h72 M560 130 h16 M584 130 h17 M560 143 h40"/>
    <circle cx="582" cy="335" r="20"/>
    <path d="M548 390 c5 -25 18 -37 34 -37 s29 12 34 37 M556 405 h52"/>
    <path d="M324 332 h48 l16 16 v58 h-64 z M372 332 v16 h16 M339 365 l-7 8 7 8 M372 365 l7 8 -7 8 M348 387 h22"/>
  </g>
  <g font-family="Arial,'Noto Sans KR',sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#173654">
    <text x="114" y="200">JSON 자료</text>
    <text x="348" y="200">Python</text>
    <text x="582" y="200">HTML 화면</text>
    <text x="582" y="437">사람 검토</text>
    <text x="348" y="437">JSON 출력</text>
  </g>
</svg>
