name: CI
on:
  push:
  pull_request:
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: python3 -m py_compile audit_desk/core.py audit_desk/server.py scripts/capture_demo.py
